name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Type-check, build and race test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: No compiled output beside the sources
        run: |
          # A stray useRoom.js next to useRoom.ts is resolved by the bundler in
          # preference to the TypeScript, which silently freezes that module at
          # whatever it said when the file was written. The build keeps passing
          # and the change never ships.
          STRAY=$(find client/src server/src \
            \( -name '*.js' -o -name '*.jsx' \) -not -name '._*' | sort)
          if [ -n "$STRAY" ]; then
            echo "compiled output found in the source tree:"
            echo "$STRAY"
            exit 1
          fi
          echo "source trees are TypeScript only"

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Race smoke test
        env:
          SERVER_PORT: 8787
          SESSION_SECRET: ci-session-secret-not-used-anywhere-else
          ADMIN_PASSWORD: ci-admin-password
          DATABASE_FILE: ./data/ci.db
        run: |
          node server/dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health > /dev/null && break
            sleep 1
          done
          node scripts/race-smoke-test.mjs http://localhost:8787 ci-admin-password
          STATUS=$?
          kill $SERVER_PID
          exit $STATUS

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the same image the hosting platforms build, so a broken
      # Dockerfile fails here rather than halfway through a deploy.
      - name: Build image
        run: docker build -t genlayer-typerace:ci .

      - name: Boot the container on a root owned volume
        run: |
          # Reproduce what a hosting platform actually does: mount a persistent
          # volume that arrives owned by root, into an image whose server runs
          # as an unprivileged user. Getting this wrong is SQLITE_CANTOPEN.
          sudo mkdir -p /tmp/typerace-data
          sudo chown root:root /tmp/typerace-data
          sudo chmod 755 /tmp/typerace-data

          docker run -d --name typerace \
            -p 8787:8787 \
            -v /tmp/typerace-data:/app/server/data \
            -e SESSION_SECRET=ci-session-secret-not-used-anywhere-else \
            -e ADMIN_PASSWORD=ci-admin-password \
            genlayer-typerace:ci

          for i in $(seq 1 45); do
            curl -sf http://localhost:8787/api/health > /dev/null && READY=1 && break
            sleep 2
          done
          if [ -z "$READY" ]; then
            echo "container never became healthy"
            docker logs typerace
            exit 1
          fi

          curl -sf http://localhost:8787/ | grep -q "GenLayer TypeRace" \
            && echo "the container serves the built client"

      - name: Fetch the app the way a browser does
        run: |
          # Vite ships the client as a module script, and a module script is
          # fetched with CORS semantics even same-origin, so the browser sends
          # an Origin header. If the server refuses its own origin the script
          # 500s and the page renders blank while /api/health still looks fine.
          ORIGIN=http://localhost:8787

          BUNDLE=$(curl -sf $ORIGIN/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          echo "entry bundle: $BUNDLE"
          test -n "$BUNDLE"

          CODE=$(curl -s -o /tmp/bundle.js -w '%{http_code}' -H "Origin: $ORIGIN" "$ORIGIN$BUNDLE")
          echo "bundle status with an Origin header: $CODE"
          test "$CODE" = "200"
          test -s /tmp/bundle.js

          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $ORIGIN" $ORIGIN/api/meta)
          echo "api status with an Origin header: $CODE"
          test "$CODE" = "200"

          echo "the browser can load the app"

      - name: The race protocol survived the bundler
        run: |
          # Every socket event the client has to handle must appear in the
          # shipped JavaScript. This is the check that would have caught a
          # module frozen by a stale compiled twin.
          ASSETS=$(docker exec typerace sh -c 'cat /app/client/dist/assets/*.js')
          for EVENT in room:state room:tick room:finished race:progress race:finish; do
            echo "$ASSETS" | grep -q "$EVENT" \
              && echo "  ok   $EVENT" \
              || { echo "  MISSING from the bundle: $EVENT"; exit 1; }
          done

      - name: Check the database was written to the volume
        run: |
          sudo ls -la /tmp/typerace-data
          sudo test -f /tmp/typerace-data/genlayer-typerace.db \
            && echo "sqlite wrote to the mounted volume"

      - name: Check the server did not stay root
        run: |
          # Ask who owns PID 1, which is the server itself after the entrypoint
          # exec'd into it. `docker exec` would start a fresh process under the
          # image default user and tell us nothing about the running server.
          OWNER=$(docker exec typerace stat -c '%U' /proc/1)
          echo "pid 1 runs as: $OWNER"
          test "$OWNER" = "node"

      - name: Container logs
        if: always()
        run: docker logs typerace && docker rm -f typerace
